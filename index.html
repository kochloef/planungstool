<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Planungstool</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    :root {
      --green:      #00F0A4;
      --bg:         #F8F5F1;
      --dark:       #003323;
      --dark2:      #004d34;
      --white:      #ffffff;
      --gray:       #e2ddd8;
      --gray2:      #c8c3bc;
      --text:       #1a1a1a;
      --danger:     #e53e3e;
      --shadow:     0 2px 8px rgba(0,51,35,0.10);
      --radius:     10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: var(--dark);
    }
    .login-box {
      background: var(--white); border-radius: 16px; padding: 48px 40px;
      width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); text-align: center;
    }
    .login-box h1 { color: var(--dark); font-size: 1.6rem; margin-bottom: 8px; }
    .login-box p  { color: #666; font-size: 0.9rem; margin-bottom: 28px; }
    .login-box input {
      width: 100%; padding: 12px 14px; margin-bottom: 14px;
      border: 1.5px solid var(--gray2); border-radius: 8px;
      font-size: 1rem; outline: none; transition: border 0.2s;
    }
    .login-box input:focus { border-color: var(--green); }
    .login-box button {
      width: 100%; padding: 13px; background: var(--green); color: var(--dark);
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }
    .login-box button:hover { background: #00d492; }
    #login-error { color: var(--danger); font-size: 0.88rem; margin-top: 10px; }
    .login-logo { font-size: 2.5rem; margin-bottom: 12px; }

    /* ── APP SHELL ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }

    /* ── HEADER ── */
    header {
      background: var(--dark); color: var(--white);
      padding: 0 28px; height: 58px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18); position: sticky; top: 0; z-index: 100;
    }
    header .logo { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.5px; color: var(--green); }
    header nav { display: flex; gap: 4px; }
    header nav button {
      background: transparent; color: var(--white); border: none;
      padding: 7px 18px; border-radius: 7px; cursor: pointer;
      font-size: 0.93rem; font-weight: 500; transition: background 0.18s, color 0.18s;
    }
    header nav button.active, header nav button:hover {
      background: var(--green); color: var(--dark);
    }
    header .header-right { display: flex; align-items: center; gap: 14px; }
    header .user-badge {
      background: var(--dark2); color: var(--green);
      padding: 5px 13px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
    }
    #btn-logout {
      background: transparent; color: var(--gray2); border: 1px solid var(--gray2);
      padding: 5px 13px; border-radius: 7px; cursor: pointer; font-size: 0.82rem;
      transition: all 0.18s;
    }
    #btn-logout:hover { background: var(--danger); color: white; border-color: var(--danger); }

    /* ── VIEWS ── */
    .view { display: none; padding: 28px; }
    .view.active { display: block; }

    /* ── PAGE HEADER ── */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .page-header h2 { font-size: 1.35rem; color: var(--dark); font-weight: 700; }
    .btn-primary {
      background: var(--green); color: var(--dark); border: none;
      padding: 9px 20px; border-radius: 8px; font-size: 0.93rem; font-weight: 700;
      cursor: pointer; transition: background 0.18s; display: flex; align-items: center; gap: 7px;
    }
    .btn-primary:hover { background: #00d492; }
    .btn-secondary {
      background: var(--white); color: var(--dark); border: 1.5px solid var(--gray2);
      padding: 8px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s;
    }
    .btn-secondary:hover { border-color: var(--green); color: var(--dark2); }
    .btn-danger {
      background: var(--danger); color: white; border: none;
      padding: 9px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: background 0.18s;
    }
    .btn-danger:hover { background: #c53030; }

    /* ── KANBAN ── */
    .kanban-board { display: grid; grid-template-columns: repeat(4,1fr); gap: 18px; align-items: start; }
    .kanban-col {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); min-height: 200px; overflow: hidden;
    }
    .kanban-col-header {
      padding: 13px 16px; font-weight: 700; font-size: 0.92rem;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 2px solid var(--gray);
    }
    .col-backlog    .kanban-col-header { border-top: 3px solid #94a3b8; }
    .col-todo       .kanban-col-header { border-top: 3px solid #f59e0b; }
    .col-inprogress .kanban-col-header { border-top: 3px solid var(--green); }
    .col-done       .kanban-col-header { border-top: 3px solid #6366f1; }
    .col-count {
      background: var(--gray); color: #555; border-radius: 20px;
      padding: 2px 9px; font-size: 0.8rem; font-weight: 700;
    }
    .kanban-cards { padding: 10px; min-height: 60px; }
    .kanban-card {
      background: var(--bg); border: 1.5px solid var(--gray);
      border-radius: 8px; padding: 11px 13px; margin-bottom: 9px;
      cursor: grab; transition: box-shadow 0.18s, border-color 0.18s;
      position: relative;
    }
    .kanban-card:hover { box-shadow: 0 4px 14px rgba(0,51,35,0.13); border-color: var(--green); }
    .kanban-card.sortable-ghost { opacity: 0.4; }
    .card-epic-badge {
      font-size: 0.72rem; font-weight: 700; color: var(--dark);
      background: var(--green); padding: 2px 8px; border-radius: 10px;
      display: inline-block; margin-bottom: 6px; opacity: 0.85;
    }
    .card-title { font-weight: 600; font-size: 0.93rem; margin-bottom: 5px; }
    .card-meta { font-size: 0.78rem; color: #777; display: flex; gap: 10px; flex-wrap: wrap; }
    .card-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.18s; }
    .kanban-card:hover .card-actions { opacity: 1; }
    .card-actions button {
      background: var(--white); border: 1px solid var(--gray2);
      border-radius: 5px; padding: 3px 7px; cursor: pointer; font-size: 0.78rem;
      transition: all 0.15s;
    }
    .card-actions button:hover { background: var(--green); border-color: var(--green); }
    .card-progress { margin-top: 8px; }
    .progress-bar-bg {
      background: var(--gray); border-radius: 4px; height: 6px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 4px; transition: width 0.3s;
    }
    .progress-label { font-size: 0.72rem; color: #888; margin-top: 2px; }
    .done-actions {
      display: flex; justify-content: flex-end; padding: 10px 10px 0;
    }

    /* ── EPICS VIEW ── */
    .epics-list { display: flex; flex-direction: column; gap: 18px; }
    .epic-card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .epic-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 20px; background: var(--dark); color: var(--white);
      cursor: pointer;
    }
    .epic-header-left { display: flex; align-items: center; gap: 12px; }
    .epic-tag {
      background: var(--green); color: var(--dark); font-size: 0.72rem;
      font-weight: 700; padding: 2px 9px; border-radius: 10px; letter-spacing: 0.3px;
    }
    .epic-title-text { font-weight: 700; font-size: 1rem; }
    .epic-header-right { display: flex; align-items: center; gap: 10px; }
    .epic-actions button {
      background: transparent; border: 1px solid rgba(255,255,255,0.25);
      color: var(--white); border-radius: 6px; padding: 4px 10px;
      cursor: pointer; font-size: 0.8rem; transition: all 0.18s;
    }
    .epic-actions button:hover { background: var(--green); color: var(--dark); border-color: var(--green); }
    .epic-chevron { font-size: 1rem; transition: transform 0.2s; }
    .epic-chevron.open { transform: rotate(180deg); }
    .epic-body { display: none; padding: 16px 20px; }
    .epic-body.open { display: block; }
    .epic-description { color: #666; font-size: 0.9rem; margin-bottom: 14px; border-bottom: 1px solid var(--gray); padding-bottom: 12px; }
    .tasks-list { display: flex; flex-direction: column; gap: 10px; }
    .task-row {
      background: var(--bg); border: 1.5px solid var(--gray);
      border-radius: 8px; overflow: hidden;
    }
    .task-row-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; cursor: pointer;
    }
    .task-row-header:hover { background: rgba(0,240,164,0.07); }
    .task-row-left { display: flex; align-items: center; gap: 10px; }
    .task-chevron { font-size: 0.85rem; color: #aaa; transition: transform 0.2s; }
    .task-chevron.open { transform: rotate(90deg); }
    .task-title-row { font-weight: 600; font-size: 0.93rem; }
    .status-badge {
      font-size: 0.72rem; font-weight: 700; padding: 2px 9px;
      border-radius: 10px; white-space: nowrap;
    }
    .status-backlog    { background: #e2e8f0; color: #475569; }
    .status-todo       { background: #fef3c7; color: #92400e; }
    .status-in_progress{ background: #d1fae5; color: #065f46; }
    .status-done       { background: #ede9fe; color: #4c1d95; }
    .task-row-right { display: flex; align-items: center; gap: 8px; }
    .task-row-right button {
      background: var(--white); border: 1px solid var(--gray2);
      border-radius: 5px; padding: 3px 9px; cursor: pointer; font-size: 0.78rem; transition: all 0.15s;
    }
    .task-row-right button:hover { background: var(--green); border-color: var(--green); }
    .task-row-right .btn-del:hover { background: var(--danger); border-color: var(--danger); color: white; }
    .task-body { display: none; padding: 12px 14px; border-top: 1px solid var(--gray); background: var(--white); }
    .task-body.open { display: block; }
    .task-meta-grid {
      display: grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr));
      gap: 8px; margin-bottom: 12px;
    }
    .meta-item { font-size: 0.82rem; }
    .meta-item span { color: #888; display: block; margin-bottom: 2px; }
    .task-desc { font-size: 0.88rem; color: #555; margin-bottom: 10px; }
    .task-links { font-size: 0.83rem; margin-bottom: 10px; }
    .task-links a { color: var(--dark2); text-decoration: underline; margin-right: 10px; }
    .subtasks-section { margin-top: 10px; }
    .subtasks-section h4 { font-size: 0.85rem; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .subtask-row {
      background: var(--bg); border: 1px solid var(--gray);
      border-radius: 6px; margin-bottom: 6px; overflow: hidden;
    }
    .subtask-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
    }
    .subtask-title { font-size: 0.88rem; font-weight: 600; }
    .subtask-right { display: flex; align-items: center; gap: 7px; }
    .subtask-right button {
      background: var(--white); border: 1px solid var(--gray2);
      border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 0.75rem; transition: all 0.15s;
    }
    .subtask-right button:hover { background: var(--green); border-color: var(--green); }
    .subtask-right .btn-del:hover { background: var(--danger); border-color: var(--danger); color: white; }
    .subtask-body { display: none; padding: 10px 12px; border-top: 1px solid var(--gray); background: var(--white); }
    .subtask-body.open { display: block; }
    .add-subtask-btn {
      background: transparent; border: 1.5px dashed var(--gray2);
      color: #888; border-radius: 6px; padding: 7px 14px;
      cursor: pointer; font-size: 0.83rem; width: 100%; margin-top: 6px;
      transition: all 0.18s;
    }
    .add-subtask-btn:hover { border-color: var(--green); color: var(--dark); background: rgba(0,240,164,0.06); }
    .add-task-btn {
      background: transparent; border: 1.5px dashed var(--gray2);
      color: #888; border-radius: 8px; padding: 9px 16px;
      cursor: pointer; font-size: 0.88rem; width: 100%; margin-top: 10px;
      transition: all 0.18s;
    }
    .add-task-btn:hover { border-color: var(--green); color: var(--dark); background: rgba(0,240,164,0.06); }

    /* ── TIMELINE ── */
    .timeline-controls {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .timeline-controls button {
      background: var(--white); border: 1.5px solid var(--gray2);
      border-radius: 7px; padding: 7px 16px; cursor: pointer; font-size: 0.88rem; font-weight: 600;
      transition: all 0.18s;
    }
    .timeline-controls button.active { background: var(--dark); color: var(--white); border-color: var(--dark); }
    .timeline-controls button:hover:not(.active) { border-color: var(--green); }
    .timeline-nav { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .timeline-nav button {
      background: var(--dark); color: var(--white); border: none;
      border-radius: 7px; padding: 7px 14px; cursor: pointer; font-size: 0.95rem; transition: background 0.18s;
    }
    .timeline-nav button:hover { background: var(--dark2); }
    .timeline-period { font-weight: 700; font-size: 0.95rem; color: var(--dark); min-width: 180px; text-align: center; }
    #timeline-container {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow-x: auto;
    }
    .timeline-table { width: 100%; border-collapse: collapse; min-width: 700px; }
    .timeline-table th {
      background: var(--dark); color: var(--white); padding: 9px 6px;
      font-size: 0.78rem; text-align: center; border-right: 1px solid rgba(255,255,255,0.1);
      white-space: nowrap;
    }
    .timeline-table th.today-col { background: var(--dark2); color: var(--green); }
    .timeline-label-col { width: 220px; min-width: 180px; }
    .timeline-table td {
      border-right: 1px solid var(--gray); border-bottom: 1px solid var(--gray);
      padding: 0; height: 36px; position: relative;
    }
    .timeline-table td.label-cell {
      padding: 0 10px; font-size: 0.83rem; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 220px;
      background: var(--bg);
    }
    .timeline-table td.today-col { background: rgba(0,240,164,0.06); }
    .tl-epic-row td { background: rgba(0,51,35,0.06); }
    .tl-epic-row td.label-cell { font-weight: 700; font-size: 0.88rem; color: var(--dark); }
    .tl-subtask-row td.label-cell {
      padding-left: 28px; font-size: 0.8rem; color: #666;
      background: rgba(248,245,241,0.7);
    }
    .tl-subtask-row td { background: rgba(248,245,241,0.4); }
    .tl-bar-cell { position: relative; }
    .tl-bar {
      position: absolute; top: 6px; height: 22px; border-radius: 5px;
      display: flex; align-items: center; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.13); cursor: pointer; transition: opacity 0.15s;
      min-width: 6px;
    }
    .tl-bar:hover { opacity: 0.82; }
    .tl-bar-fill {
      height: 100%; border-radius: 5px 0 0 5px; transition: width 0.3s;
      background: rgba(0,0,0,0.18);
    }
    .tl-bar-label {
      position: absolute; left: 6px; right: 6px;
      font-size: 0.68rem; font-weight: 700; color: white;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3); pointer-events: none;
    }
    .today-line {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: var(--green); opacity: 0.7; pointer-events: none; z-index: 5;
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 200;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 14px;
      padding: 32px 30px; width: 520px; max-width: 96vw; max-height: 90vh;
      overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.22); position: relative;
    }
    .modal h3 { font-size: 1.15rem; color: var(--dark); margin-bottom: 20px; font-weight: 700; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #444; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--gray2);
      border-radius: 8px; font-size: 0.93rem; outline: none;
      transition: border 0.18s; background: var(--bg); font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--green);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .modal-close {
      position: absolute; top: 16px; right: 18px;
      background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #aaa;
    }
    .modal-close:hover { color: var(--danger); }
    .color-preview {
      display: inline-block; width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--gray2); vertical-align: middle; margin-left: 8px;
    }
    .date-warning { font-size: 0.78rem; color: var(--danger); margin-top: 4px; display: none; }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 28px; right: 28px;
      background: var(--dark); color: var(--white);
      padding: 13px 22px; border-radius: 10px; font-size: 0.9rem;
      box-shadow: 0 4px 18px rgba(0,0,0,0.22);
      transform: translateY(80px); opacity: 0;
      transition: all 0.3s; z-index: 999; pointer-events: none;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-left: 4px solid var(--green); }
    #toast.error   { border-left: 4px solid var(--danger); }

    /* ── CONFIRM DIALOG ── */
    .confirm-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 300;
      align-items: center; justify-content: center;
    }
    .confirm-overlay.open { display: flex; }
    .confirm-box {
      background: var(--white); border-radius: 12px; padding: 28px 28px 22px;
      width: 360px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    }
    .confirm-box h4 { font-size: 1.05rem; margin-bottom: 10px; color: var(--dark); }
    .confirm-box p  { font-size: 0.88rem; color: #666; margin-bottom: 20px; }
    .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .kanban-board { grid-template-columns: repeat(2,1fr); }
    }
    @media (max-width: 600px) {
      .kanban-board { grid-template-columns: 1fr; }
      .view { padding: 14px; }
      header { padding: 0 14px; }
      .form-row { grid-template-columns: 1fr; }
    }

    /* Logged-in only elements */
    .auth-only { display: none; }
    body.is-admin .auth-only { display: inline-flex; }
    body.is-admin .auth-only-block { display: block; }
    .auth-only-block { display: none; }
  </style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">📋</div>
    <h1>Planungstool</h1>
    <p>Bitte melde dich an</p>
    <input type="email" id="login-email" placeholder="E-Mail" autocomplete="username" />
    <input type="password" id="login-password" placeholder="Passwort" autocomplete="current-password" />
    <button id="btn-login">Anmelden</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <header>
    <span class="logo">📋 Planungstool</span>
    <nav>
      <button class="nav-btn active" data-view="kanban">Kanban</button>
      <button class="nav-btn" data-view="epics">Epics &amp; Tasks</button>
      <button class="nav-btn" data-view="timeline">Timeline</button>
    </nav>
    <div class="header-right">
      <span class="user-badge" id="user-badge">Gast</span>
      <button id="btn-logout">Abmelden</button>
    </div>
  </header>

  <!-- KANBAN VIEW -->
  <div class="view active" id="view-kanban">
    <div class="page-header">
      <h2>Kanban Board</h2>
      <button class="btn-primary auth-only" id="btn-add-task-kanban">＋ Neue Aufgabe</button>
    </div>
    <div class="kanban-board">
      <div class="kanban-col col-backlog">
        <div class="kanban-col-header">
          <span>Backlog</span><span class="col-count" id="cnt-backlog">0</span>
        </div>
        <div class="kanban-cards" id="kanban-backlog" data-status="backlog"></div>
      </div>
      <div class="kanban-col col-todo">
        <div class="kanban-col-header">

function confirm(title, msg) {
  return new Promise(resolve => {
    const overlay = document.getElementById('confirm-dialog');
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-msg').textContent = msg;
    overlay.classList.add('open');
    const ok = document.getElementById('confirm-ok');
    const cancel = document.getElementById('confirm-cancel');
    function cleanup(result) {
      overlay.classList.remove('open');
      ok.removeEventListener('click', onOk);
      cancel.removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk()     { cleanup(true);  }
    function onCancel() { cleanup(false); }
    ok.addEventListener('click', onOk);
    cancel.addEventListener('click', onCancel);
  });
}

function statusLabel(s) {
  return { backlog:'Backlog', todo:'Zu Erledigen', in_progress:'In Arbeit', done:'Abgeschlossen' }[s] || s;
}
function fmtDate(d) {
  if (!d) return '–';
  const [y,m,day] = d.split('-');
  return `${day}.${m}.${y}`;
}
function progressInfo(est, logged) {
  if (!est || parseFloat(est) <= 0) return null;
  const pct = Math.min(100, Math.round((parseFloat(logged||0) / parseFloat(est)) * 100));
  return { pct, logged: parseFloat(logged||0), est: parseFloat(est) };
}
function progressBarHTML(est, logged, color) {
  const info = progressInfo(est, logged);
  if (!info) return '';
  const fill = info.pct > 80 ? '#e53e3e' : info.pct > 50 ? '#f59e0b' : color || '#00F0A4';
  return `<div class="card-progress">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" style="width:${info.pct}%;background:${fill}"></div>
    </div>
    <div class="progress-label">${info.logged}h / ${info.est}h (${info.pct}%)</div>
  </div>`;
}
function parseLinks(raw) {
  if (!raw) return [];
  try { const p = JSON.parse(raw); if (Array.isArray(p)) return p; } catch(e) {}
  return raw.split(',').map(l => l.trim()).filter(Boolean);
}
function linksHTML(raw) {
  const links = parseLinks(raw);
  if (!links.length) return '';
  return '<div class="task-links">🔗 ' + links.map(l => `<a href="${l}" target="_blank">${l}</a>`).join('') + '</div>';
}

function renderKanban() {
  const cols = ['backlog','todo','in_progress','done'];
  cols.forEach(status => {
    const container = document.getElementById('kanban-' + status);
    const colTasks = tasks.filter(t => t.status === status);
    container.innerHTML = '';
    colTasks.forEach(task => {
      const epic = epics.find(e => e.id === task.epic_id);
      const card = document.createElement('div');
      card.className = 'kanban-card';
      card.dataset.id = task.id;
      const prog = progressBarHTML(task.estimated_hours, task.logged_hours, task.bar_color);
      card.innerHTML = `
        ${epic ? `<div class="card-epic-badge">${epic.title}</div>` : ''}
        <div class="card-title">${task.title}</div>
        <div class="card-meta">
          ${task.start_date ? `<span>📅 ${fmtDate(task.start_date)}</span>` : ''}
          ${task.end_date   ? `<span>🏁 ${fmtDate(task.end_date)}</span>` : ''}
          ${task.estimated_hours ? `<span>⏱ ${task.estimated_hours}h</span>` : ''}

        ${prog}

          <button class="card-edit" data-id="${task.id}">✏️</button>
          <button class="card-del"  data-id="${task.id}">🗑️</button>
        </div>` : ''}
      `;
      container.appendChild(card);
    });
    document.getElementById('cnt-' + (status === 'in_progress' ? 'inprogress' : status)).textContent = colTasks.length;

  // Drag & Drop (only for admin)
  if (isAdmin) {
    cols.forEach(status => {
      const el = document.getElementById('kanban-' + status);

        group: 'kanban', animation: 150, ghostClass: 'sortable-ghost',

      </div>
      <div class="task-body" id="task-body-${task.id}">
        ${task.description ? `<div class="task-desc">${task.description}</div>` : ''}
        <div class="task-meta-grid">
          ${task.start_date ? `<div class="meta-item"><span>Startdatum</span>${fmtDate(task.start_date)}</div>` : ''}
          ${task.end_date   ? `<div class="meta-item"><span>Enddatum</span>${fmtDate(task.end_date)}</div>` : ''}
          ${task.estimated_hours ? `<div class="meta-item"><span>Schätzung</span>${task.estimated_hours}h</div>` : ''}
          ${task.logged_hours ? `<div class="meta-item"><span>Protokolliert</span>${task.logged_hours}h</div>` : ''}
        </div>
        ${prog}
        ${linksHTML(task.links)}
        <div class="subtasks-section">
          <h4>Unteraufgaben (${taskSubs.length})</h4>
          ${taskSubs.map(s => renderSubtaskRow(s)).join('')}
          ${isAdmin ? `<button class="add-subtask-btn" data-task="${task.id}">＋ Unteraufgabe hinzufügen</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderSubtaskRow(s) {
  const prog = progressBarHTML(s.estimated_hours, s.logged_hours, s.bar_color);
  return `
    <div class="subtask-row">
      <div class="subtask-header" data-subtask="${s.id}">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="color:#aaa;font-size:0.8rem;">↳</span>
          <span class="subtask-title">${s.title}</span>
          <span class="status-badge status-${s.status}">${statusLabel(s.status)}</span>
        </div>
        <div class="subtask-right">
          ${s.start_date ? `<span style="font-size:0.75rem;color:#888;">📅 ${fmtDate(s.start_date)} – ${fmtDate(s.end_date)}</span>` : ''}
          ${isAdmin ? `
            <button class="subtask-edit-btn" data-id="${s.id}">✏️</button>
            <button class="subtask-del-btn btn-del" data-id="${s.id}">🗑️</button>
          ` : ''}
        </div>
      </div>
      <div class="subtask-body" id="subtask-body-${s.id}">
        ${s.description ? `<div class="task-desc">${s.description}</div>` : ''}
        <div class="task-meta-grid">
          ${s.start_date ? `<div class="meta-item"><span>Startdatum</span>${fmtDate(s.start_date)}</div>` : ''}
          ${s.end_date   ? `<div class="meta-item"><span>Enddatum</span>${fmtDate(s.end_date)}</div>` : ''}
          ${s.estimated_hours ? `<div class="meta-item"><span>Schätzung</span>${s.estimated_hours}h</div>` : ''}
          ${s.logged_hours ? `<div class="meta-item"><span>Protokolliert</span>${s.logged_hours}h</div>` : ''}
        </div>
        ${prog}
        ${linksHTML(s.links)}
      </div>
    </div>
  `;
}

function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(overlay.id); });
});

// ── EPIC MODAL ──
function openEpicModal(id = null) {
  editingEpicId = id;
  document.getElementById('modal-epic-title').textContent = id ? 'Epic bearbeiten' : 'Neues Epic';
  if (id) {
    const epic = epics.find(e => e.id === id);
    document.getElementById('epic-title').value = epic.title;
    document.getElementById('epic-desc').value  = epic.description || '';
  } else {
    document.getElementById('epic-title').value = '';
    document.getElementById('epic-desc').value  = '';
  }
  openModal('modal-epic');
}

document.getElementById('btn-add-epic').addEventListener('click', () => openEpicModal());

document.getElementById('btn-save-epic').addEventListener('click', async () => {
  const title = document.getElementById('epic-title').value.trim();
  if (!title) { toast('Bitte einen Titel eingeben.', 'error'); return; }
  const payload = { title, description: document.getElementById('epic-desc').value.trim() };
  if (editingEpicId) {
    await sb.from('epics').update(payload).eq('id', editingEpicId);
    toast('Epic aktualisiert ✓');
  } else {
    await sb.from('epics').insert(payload);
    toast('Epic erstellt ✓');

  closeModal('modal-epic');
  loadAll();
});

    document.getElementById('task-desc').value   = t.description || '';
    document.getElementById('task-links').value  = parseLinks(t.links).join(', ');

// ── SUBTASK MODAL ──
function openSubtaskModal(id = null, taskId = null) {
  editingSubtaskId = id;
  currentSubtaskParentId = taskId;
  document.getElementById('modal-subtask-title').textContent = id ? 'Unteraufgabe bearbeiten' : 'Neue Unteraufgabe';
  // Get parent task date constraints
  let parentTask = null;
  if (id) {
    const s = subtasks.find(x => x.id === id);
    parentTask = tasks.find(t => t.id === s.task_id);
    currentSubtaskParentId = s.task_id;
    document.getElementById('subtask-title').value  = s.title;
    document.getElementById('subtask-desc').value   = s.description || '';
    document.getElementById('subtask-links').value  = parseLinks(s.links).join(', ');
    document.getElementById('subtask-start').value  = s.start_date || '';
    document.getElementById('subtask-end').value    = s.end_date || '';
    document.getElementById('subtask-est').value    = s.estimated_hours || '';
    document.getElementById('subtask-logged').value = s.logged_hours || '';
    document.getElementById('subtask-status').value = s.status;
    document.getElementById('subtask-color').value  = s.bar_color || '#00F0A4';
  } else {
    parentTask = tasks.find(t => t.id === taskId);
    document.getElementById('subtask-title').value  = '';
    document.getElementById('subtask-desc').value   = '';
    document.getElementById('subtask-links').value  = '';
    document.getElementById('subtask-start').value  = parentTask?.start_date || '';
    document.getElementById('subtask-end').value    = parentTask?.end_date || '';
    document.getElementById('subtask-est').value    = '';
    document.getElementById('subtask-logged').value = '';
    document.getElementById('subtask-status').value = 'backlog';
    document.getElementById('subtask-color').value  = '#00F0A4';
  }
  // Set min/max for dates
  if (parentTask) {
    if (parentTask.start_date) {
      document.getElementById('subtask-start').min = parentTask.start_date;
      document.getElementById('subtask-end').min   = parentTask.start_date;
    }
    if (parentTask.end_date) {
      document.getElementById('subtask-start').max = parentTask.end_date;
      document.getElementById('subtask-end').max   = parentTask.end_date;
    }
  }
  updateSubtaskLoggedVisibility();
  document.getElementById('subtask-color-preview').style.background = document.getElementById('subtask-color').value;
  openModal('modal-subtask');
}

function updateSubtaskLoggedVisibility() {
  const est = document.getElementById('subtask-est').value;
  document.getElementById('subtask-logged-group').style.opacity = est ? '1' : '0.4';
  document.getElementById('subtask-logged').disabled = !est;
}

document.getElementById('btn-save-subtask').addEventListener('click', async () => {

  }
  if (start && end && end < start) { toast('Enddatum liegt vor dem Startdatum!', 'error'); return; }
  const est    = document.getElementById('subtask-est').value;
  const logged = est ? document.getElementById('subtask-logged').value : '0';
  const rawLinks = document.getElementById('subtask-links').value.trim();
  const linksArr = rawLinks ? rawLinks.split(',').map(l=>l.trim()).filter(Boolean) : [];
  const payload = {
    task_id: currentSubtaskParentId, title,
    description: document.getElementById('subtask-desc').value.trim(),
    links: linksArr.length ? JSON.stringify(linksArr) : null,
    start_date: start || null, end_date: end || null,
    estimated_hours: est ? parseFloat(est) : null,
    logged_hours: logged ? parseFloat(logged) : 0,
    status: document.getElementById('subtask-status').value,
    bar_color: document.getElementById('subtask-color').value,
  };
  if (editingSubtaskId) {
    await sb.from('subtasks').update(payload).eq('id', editingSubtaskId);
    toast('Unteraufgabe aktualisiert ✓');
  } else {
    await sb.from('subtasks').insert(payload);
    toast('Unteraufgabe erstellt ✓');
  }
  closeModal('modal-subtask');
  loadAll();
});

// ══════════════════════════════════════════════
//  TIMELINE
// ══════════════════════════════════════════════
document.querySelectorAll('.tl-mode').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tl-mode').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tlMode = btn.dataset.mode;
    tlOffset = 0;
    renderTimeline();
  });
});
document.getElementById('tl-prev').addEventListener('click',  () => { tlOffset--; renderTimeline(); });
document.getElementById('tl-next').addEventListener('click',  () => { tlOffset++; renderTimeline(); });
document.getElementById('tl-today').addEventListener('click', () => { tlOffset = 0; renderTimeline(); });

function getTimelineDays() {
  const today = new Date(); today.setHours(0,0,0,0);
  let days = [];
  if (tlMode === 'week') {
    // Start on Monday
    const dow = today.getDay() === 0 ? 6 : today.getDay() - 1;
    const monday = new Date(today); monday.setDate(today.getDate() - dow + tlOffset * 7);
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      days.push(d);
    }
  } else {
    const ref = new Date(today.getFullYear(), today.getMonth() + tlOffset, 1);
    const daysInMonth = new Date(ref.getFullYear(), ref.getMonth() + 1, 0).getDate();
    for (let i = 1; i <= daysInMonth; i++) {
      days.push(new Date(ref.getFullYear(), ref.getMonth(), i));
    }
  }
  return days;
}

function dateToStr(d) {
  return d.toISOString().split('T')[0];
}

function renderTimeline() {
  const days = getTimelineDays();
  const todayStr = dateToStr(new Date());
  const start = days[0], end = days[days.length - 1];
  const startStr = dateToStr(start), endStr = dateToStr(end);

  // Period label
  const opts = tlMode === 'week'
    ? { day:'2-digit', month:'short' }
    : { month:'long', year:'numeric' };
  document.getElementById('tl-period').textContent = tlMode === 'week'
    ? `${start.toLocaleDateString('de-DE',{day:'2-digit',month:'short'})} – ${end.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'})}`
    : start.toLocaleDateString('de-DE', { month:'long', year:'numeric' });

  const dayNames = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  const container = document.getElementById('timeline-container');

  let html = `<table class="timeline-table"><thead><tr>
    <th class="timeline-label-col">Aufgabe</th>
    ${days.map(d => {
      const ds = dateToStr(d);
      const isToday = ds === todayStr;
      return `<th class="${isToday ? 'today-col' : ''}">${dayNames[d.getDay()]}<br/><span style="font-size:0.85em">${d.getDate()}</span></th>`;
    }).join('')}
  </tr></thead><tbody>`;

  const totalDays = days.length;

  function barCells(itemStart, itemEnd, color, label, est, logged) {
    if (!itemStart || !itemEnd) return days.map(() => '<td></td>').join('');
    const cells = days.map((d, i) => {
      const ds = dateToStr(d);
      const isToday = ds === todayStr;
      const inRange = ds >= itemStart && ds <= itemEnd;
      if (!inRange) return `<td class="${isToday ? 'today-col' : ''}"></td>`;
      const isFirst = ds === itemStart || i === 0;
      const isLast  = ds === itemEnd   || i === totalDays - 1;
      if (isFirst) {
        // Calculate bar span
        let span = 0;
        for (let j = i; j < days.length; j++) {
          if (dateToStr(days[j]) <= itemEnd) span++;
          else break;
        }
        // Progress fill
        let fillPct = 0;
        if (est && parseFloat(est) > 0) {
          fillPct = Math.min(100, Math.round((parseFloat(logged||0) / parseFloat(est)) * 100));
        } else {
          fillPct = 100; // full color if no estimate
        }
        const fillColor = est ? (fillPct > 80 ? '#e53e3e' : fillPct > 50 ? '#f59e0b' : 'rgba(0,0,0,0.2)') : 'transparent';
        return `<td class="tl-bar-cell ${isToday ? 'today-col' : ''}" colspan="${span}">
          <div class="tl-bar" style="left:2px;right:2px;background:${color};" title="${label}">
            <div class="tl-bar-fill" style="width:${fillPct}%;background:${fillColor}"></div>
            <span class="tl-bar-label">${label}</span>
          </div>
        </td>`;
      }
      return null; // merged by colspan
    }).filter(c => c !== null);
    return cells.join('');
  }

  // Render epics and their tasks
  epics.forEach(epic => {
    const epicTasks = tasks.filter(t => t.epic_id === epic.id);
    // Epic row (no bar, just label)
    html += `<tr class="tl-epic-row">
      <td class="label-cell">📁 ${epic.title}</td>
      ${days.map(d => `<td class="${dateToStr(d) === todayStr ? 'today-col' : ''}"></td>`).join('')}
    </tr>`;

    epicTasks.forEach(task => {
      const color = task.bar_color || '#00F0A4';
      html += `<tr>
        <td class="label-cell" style="padding-left:16px;">
          <span class="status-badge status-${task.status}" style="font-size:0.68rem;padding:1px 6px;">${statusLabel(task.status)}</span>
          ${task.title}
        </td>
        ${barCells(task.start_date, task.end_date, color, task.title, task.estimated_hours, task.logged_hours)}
      </tr>`;

      // Subtasks
      const taskSubs = subtasks.filter(s => s.task_id === task.id);
      taskSubs.forEach(sub => {
        const subColor = sub.bar_color || '#00F0A4';
        html += `<tr class="tl-subtask-row">
          <td class="label-cell">↳ ${sub.title}</td>
          ${barCells(sub.start_date, sub.end_date, subColor, sub.title, sub.estimated_hours, sub.logged_hours)}
        </tr>`;
      });
    });
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}
